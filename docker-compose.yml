# ─────────────────────────────────────────────────────────────────────────────
# NEXUS Mission Control — full local stack
#
#   docker compose up -d
#
# Core services (api, web) run with zero paid dependencies. The web service is
# a one-shot bundler: it writes the built SPA into a shared volume and exits,
# and the API serves it from /web-dist. The profiled
# services (postgres, prometheus, grafana, jenkins, registry, nginx) are
# opt-in: enable with `--profile full` or selectively, e.g.
# `docker compose --profile observability up -d`.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Core ──────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: nexus/api:latest
    container_name: nexus-api
    environment:
      NODE_ENV: production
      # NEXUS_HOST must be 0.0.0.0 inside a container, otherwise the process
      # binds loopback and the published port is unreachable.
      NEXUS_HOST: 0.0.0.0
      NEXUS_PORT: '8787'
      NEXUS_DATA_DIR: /data
      # Postgres mode (optional): uncomment DATABASE_URL to switch the store.
      # DATABASE_URL: postgres://nexus:nexus@postgres:5432/nexus
      # Empty means "generate one and persist it in the data volume" — a secret
      # published in this repository could otherwise be used to forge sessions.
      # The API refuses a known placeholder on any non-loopback bind.
      NEXUS_JWT_SECRET: ${NEXUS_JWT_SECRET:-}
      # Serve the staged SPA bundle from the API (single-origin deployment).
      NEXUS_SERVE_WEB_DIST: /web-dist
      # Optional host-integrated adapters (leave empty for a self-contained stack).
      # Inside a container the host is reached via host.docker.internal.
      DATABASE_URL: ${NEXUS_DOCKER_DATABASE_URL:-}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-}
      NEXUS_NGINX_STATUS_URL: ${NEXUS_NGINX_STATUS_URL:-}
    volumes:
      - api-data:/data
      - web-dist:/web-dist:ro
    # Lets the container reach services on the host (Prometheus, Nginx, ...).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${NEXUS_HTTP_PORT:-8787}:8787'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
    # The API serves the SPA, so it must start once the bundle is staged.
    depends_on:
      web:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: nexus/web:latest
    container_name: nexus-web
    volumes:
      - web-dist:/out
    # The web image's only job is to materialize the static bundle into the
    # shared volume consumed by the API. It exits 0 when done.
    command: ['sh', '-c', 'cp -r /web-dist/. /out/ && echo "web bundle staged"']
    restart: 'no'

  # ── Optional: PostgreSQL persistence ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    profiles: ['postgres']
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    volumes:
      - pg-data:/var/lib/postgresql/data
    # Not published to the host on purpose: the api container reaches it over the
    # compose network. Publishing 5432 here would collide with a host PostgreSQL.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Optional: observability stack ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: nexus-prometheus
    profiles: ['observability']
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom-data:/prometheus
    ports:
      - '9090:9090'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: nexus-grafana
    profiles: ['observability']
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '3300:3000'
    depends_on:
      - prometheus
    restart: unless-stopped

  # Probes /ready from outside the API process so "port answers but app is
  # not ready" is distinguishable from "process is gone".
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: nexus-blackbox
    profiles: ['observability']
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - '9115:9115'
    restart: unless-stopped

  # Optional OTLP sink: re-exposes ingested metrics on :8889 for Prometheus.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: nexus-otel
    profiles: ['observability']
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '4317:4317'
      - '4318:4318'
      - '8889:8889'
    restart: unless-stopped

  # ── Optional: reverse proxy (serves web + proxies API/realtime) ──────────
  nginx:
    image: nginx:1.27-alpine
    container_name: nexus-nginx
    profiles: ['proxy']
    volumes:
      - ./nginx/nexus.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '8080:80'
    depends_on:
      - api
    restart: unless-stopped

  # ── Optional: CI engine ───────────────────────────────────────────────────
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: nexus-jenkins
    profiles: ['ci']
    volumes:
      - jenkins-data:/var/jenkins_home
    ports:
      - '8081:8080'
      - '50000:50000'
    restart: unless-stopped

  # ── Optional: local container registry ────────────────────────────────────
  registry:
    image: registry:2.8.3
    container_name: nexus-registry
    profiles: ['ci']
    ports:
      - '5001:5000'
    volumes:
      - registry-data:/var/lib/registry
    restart: unless-stopped

volumes:
  api-data:
  web-dist:
  pg-data:
  prom-data:
  grafana-data:
  jenkins-data:
  registry-data:
